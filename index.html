<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding</title>
     <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-image:url('background.jpeg');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            
        }
        .katayam{
           margin-left: 400px;
           margin-top: -170px;
           
        }
        .kimage{
            display: block;
            width: 50%;
        }
        @media (max-width: 768px) {
            .katayam{
                margin-left: 10%;
                margin-top: -80px;
            }
            .kimage{
                width: 90% !important;
            }
            .wetext{
                margin-left: 90px;
            }
        }

        .wetext{
            letter-spacing: 2px;
            font-family: "Anton", sans-serif;
            font-weight: 400;
            font-style: normal;
            font-size: 15px;
            margin-left: 20%;
            color: #b59049;
            margin-top: 10px;
        }
       

        .divider{
            display: flex;
            align-items: center;
            justify-content: center;
            width: 200px;
            margin: 15px auto;
        }

        diamond{
            width: 6px;
            height: 6px;
            background: #b59049;
            transform: rotate(45deg);
            margin: 0 10px;
        }

        .divider::before,.divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: #b59049;
        }

        .yuvala{
            text-align: center;
            color: #8a6f3a;
        }
        .date{
            text-align: center;
            color: #b59049;
        }
        .invite{
            background: transparent;
            border: 2.5px solid transparent;

            background-image: linear-gradient(90deg, #b59049, #e8dcc4, #b59049);

            color: #b59049;
            font-family: "Anton" , sans-serif;
            font-size: 13px;
            letter-spacing: 2px;
            padding: 14px 35px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            margin-left: 20%;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .invite:hover{
            background: #b59049;
            color: #fff;
        }
        .open{
            text-decoration: none;
            color: #8a6f3a;
            margin-left: -10px;
            
        }
        .open:hover{
            color: wheat;
        }

        .natum{
            display: block;
            max-width: 100%;
            height: auto;
            align-items: center;
            margin: 0 auto;
        }


        /*slide animate*/
        /* Page Transition Overlay එක */
/* පේජ් එක යටට තල්ලු නොවන, හිස් ඉඩ නොහැදෙන නව Overlay CSS එක */
.page-transition-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: #1a1816; /* ඔයාගේ Theme එකේ Dark Color එක */
  z-index: 99999;
  pointer-events: none;
  opacity: 0;
  visibility: hidden; /* මේකෙන් පේජ් එක යට කිසිම හිස් ඉඩක් හැදෙන්නේ නැහැ */
  transition: opacity 0.4s ease, visibility 0.4s ease;
}

/* Button එක Click කරපු ගමන් Slide නොවී Smooth එකේ Fade වෙනවා */
.page-transition-overlay.is-active {
  opacity: 1;
  visibility: visible;
  pointer-events: all;
}

/* අලුත් Page එකට ආපු ගමන් මුළු Page එකම ලස්සනට Smooth වී Open වීම */
body {
  animation: pageFadeIn 0.6s ease-out forwards;
}

@keyframes pageFadeIn {
  from {
    opacity: 0;
    transform: scale(0.98); /* පොඩියට ඉඳන් ලොකු වෙන Effect එකක් */
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* (Optional) Button එකේ Style එක */
.transition-btn {
  display: inline-block;
  padding: 12px 25px;
  background-color: #723c4a;
  color: #ffffff;
  text-decoration: none;
  border-radius: 25px;
  font-family: sans-serif;
  font-weight: bold;
  transition: transform 0.2s ease;
}

.transition-btn:active {
  transform: scale(0.95);
}


/*image retata*/
@keyframes haMandalaSpin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

.ha-mandala-spin {
  animation: haMandalaSpin 25s linear infinite;
  transform-origin: center center;
  will-change: transform;
}

/*pihatu*/
.ha-feathers-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: hidden;
  z-index: 2;
}

.ha-feather {
  position: absolute;
  top: -30px;
  color: #7c4d32;
  opacity: 0.22;
  line-height: 1;
  user-select: none;
  animation-name: haFeatherFall;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}

@keyframes haFeatherFall {
  0% {
    transform: translate3d(0, -30px, 0) rotate(0deg);
    opacity: 0;
  }
  15% {
    opacity: 0.22;
  }
  50% {
    transform: translate3d(18px, 50vh, 0) rotate(22deg);
    opacity: 0.2;
  }
  85% {
    opacity: 0.16;
  }
  100% {
    transform: translate3d(-14px, 105vh, 0) rotate(-18deg);
    opacity: 0;
  }
}

</style>
</head>
<body>

    <div class="ha-feathers-container" id="haFeathersContainer" aria-hidden="true"></div>
    <div class="page-transition-overlay"></div>

    <div class="katayam">
        <img src="katayam.png" alt="katayam" class="kimage ha-mandala-spin">
        <p class="wetext">THE WEDDING OF</p>
    </div> <br>

    <div class="divider">
        <span class="diamond"></span>
    </div> <br>
    <h1 class="yuvala">Milan & Kushani</h1> <br>
    <p class="date">Wednesday, 27<span style="vertical-align: super;">th</span> January 2027</p> <br>
    <p style="color: #b59049;" class="date">Time : 6.30 P.M. - 11.30 P.M. </p>
    <br> <br>
    <a href="2.html" class="open"><button class="invite" onclick="goToPage2()" class="transition-btn">OPEN INVITATION</button> </a> <br>
    <div class="natum">
        <img src="natum.png" alt="preaheta" style="width: 100%;">
    </div>

    <script>
    function goToPage2() {
        // Permission Flag එක සෙට් කරලා Page 2 එකට යනවා
        sessionStorage.setItem('allowAccess', 'true');
        window.location.href = '2.html';
    }


    //slide trans
    document.addEventListener('DOMContentLoaded', () => {
  const transitionButtons = document.querySelectorAll('.transition-btn');
  const overlay = document.querySelector('.page-transition-overlay');

  transitionButtons.forEach(button => {
    button.addEventListener('click', function(e) {
      e.preventDefault(); // එකපාරටම Page එක Reload වෙන එක නවත්වනවා
      
      const targetUrl = this.getAttribute('href'); // යා යුතු Page එකේ Link එක
      
      // Overlay Animation එක Active කරනවා
      if (overlay) {
        overlay.classList.add('is-active');
      }

      // Animation එක ඉවර වුණ ගමන් (මිලිසෙකන්ඩ් 500කින්) අලුත් පේජ් එකට යනවා
      setTimeout(() => {
        window.location.href = targetUrl;
      }, 500);
    });
  });
});


// URL එකෙන් නම ගන්නවා
 const urlParams = new URLSearchParams(window.location.search);
  const guestName = urlParams.get('name'); 
  const inviteType = urlParams.get('type');

  // නම සහ ආසන ගාන තාවකාලිකව Memory එකේ සේව් කිරීම
  if (guestName) {
    sessionStorage.setItem('weddingGuestName', guestName);
  }
  if (inviteType) {
    sessionStorage.setItem('weddingInviteType', inviteType);
  }


  //pihatu
  document.addEventListener("DOMContentLoaded", function () {
  const container = document.getElementById("haFeathersContainer");
  if (!container) return;

  const featherShapes = [
    '<svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor"><path d="M20.24 2.76C14.5 3.4 9.6 6.8 6.9 11.7c-1.5 2.7-2.2 5.6-2.4 8.2L3 21.4l1.4 1.4 1.6-1.6c2.5-.2 5.3-.9 8-2.4 4.9-2.7 8.3-7.6 8.9-13.3l.3-2.9-2.9.5zm-3.1 6.7l-6.6 6.6-1.1-1.1 6.6-6.6 1.1 1.1z"/></svg>',
    '<svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor"><path d="M19.5 3.5c-4.8.8-8.9 3.7-11.2 7.9-1.1 2-1.7 4.2-1.9 6.2L5 19l1.2 1.2 1.4-1.4c2-.2 4.2-.8 6.2-1.9 4.2-2.3 7.1-6.4 7.9-11.2l.2-2.4-2.4.2zm-2.8 5.9l-5.7 5.7-.9-.9 5.7-5.7.9.9z"/></svg>'
  ];

  function spawnFeather() {
    const feather = document.createElement("span");
    feather.className = "ha-feather";
    feather.innerHTML = featherShapes[Math.floor(Math.random() * featherShapes.length)];

    const size = Math.floor(Math.random() * 7) + 12; // 12px - 18px (පොඩි පිහාටු)
    const leftPos = Math.random() * 100;
    const duration = (Math.random() * 6 + 8).toFixed(2); // 8s - 14s
    const delay = (Math.random() * 1.5).toFixed(2);
    const maxOpacity = (Math.random() * 0.1 + 0.14).toFixed(2); // 0.14 - 0.24 (ළාවට පේන්න)

    feather.style.width = size + "px";
    feather.style.height = size + "px";
    feather.style.left = leftPos + "vw";
    feather.style.animationDuration = duration + "s";
    feather.style.animationDelay = delay + "s";
    feather.style.setProperty("--feather-opacity", maxOpacity);

    container.appendChild(feather);

    setTimeout(function () {
      feather.remove();
    }, (parseFloat(duration) + parseFloat(delay)) * 1000 + 300);
  }

  for (let i = 0; i < 6; i++) {
    setTimeout(spawnFeather, i * 450);
  }

  setInterval(spawnFeather, 950);
});


</script>
</body>
</html>
