<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Dark mode වලදී බ්‍රව්සරය මගින් වර්ණ වෙනස් කිරීම වැළැක්වීමට -->
    <meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
    <title>Save the Date - Kushani & Milan</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      /* Dark Mode වලදී වර්ණ වෙනස් වීම වැළැක්වීම */
:root {
    color-scheme: light only;
    forced-color-adjust: none;
}
*{
    margin: 0;
    padding: 0;
}

.invitation-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #f3ece1 !important;
  
    box-sizing: border-box;
    font-family: 'Cinzel', serif;
    color-scheme: light only;
}

/* ප්‍රධාන කාඩ්පත */
.invitation-card {
    position: relative;
    width: 100%;
    max-width: 520px;
    background-color: #fbf6ee !important;
    /* පසුබිමට texture image එකක් ඇත්නම් පහත පේළිය uncomment කරන්න */
    /* background-image: url('bg-texture.jpg'); */
    background-size: cover;
    background-position: center;
    box-shadow: 0 15px 40px rgba(74, 59, 44, 0.15);
    /* padding: 22px; */
    box-sizing: border-box;
    overflow: hidden;
    border-radius: 8px;
}

/* රන්වන් ආරුක්කු රාමුව */
.gold-arch-frame {
    position: relative;
    border: 2px solid #b5924c !important;
    border-top-right-radius: 230px;
    border-bottom-left-radius: 230px;
    padding: 45px 25px 50px 25px;
    z-index: 2;
    min-height: 670px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

/* මල් සැරසිලි පින්තූර */
.floral-top-left {
    position: absolute;
    top: -10px;
    left: -10px;
    width: 240px;
    max-width: 52%;
    z-index: 3;
    pointer-events: none;
}

.floral-bottom-right {
    position: absolute;
    bottom: -10px;
    right: -10px;
    width: 230px;
    max-width: 50%;
    z-index: 3;
    pointer-events: none;
}

/* ජෝඩුවගේ පින්තූරය */
.couple-container {
    position: absolute;
    left: 5px;
    bottom: 65px;
    width: 44%;
    z-index: 1;
    pointer-events: none;
}

.couple-img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
}

/* අන්තර්ගතය (Text Content Area) */
.content-area {
    position: relative;
    z-index: 4;
    margin-left: 34%;
    text-align: center;
    color: #3a4028 !important;
}

.save-the-date {
    font-family: 'Great Vibes', cursive;
    font-size: 3.6rem;
    line-height: 0.95;
    font-weight: 400;
    color: #3a4028 !important;
    margin: 0 0 15px 0;
}

.save-the-date .the-word {
    font-size: 2.3rem;
}

.gold-heart {
    color: #b5924c !important;
    font-size: 2.2rem;
    vertical-align: middle;
}

.subtitle {
    font-size: 0.72rem;
    letter-spacing: 2.5px;
    font-weight: 600;
    color: #2f3322 !important;
    margin: 5px 0;
}

/* ඉරි සහ හදවත් බෙදුම්කරු */
.heart-divider, .and-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 6px auto;
    width: 85%;
}

.heart-divider .line, .and-divider .line {
    flex: 1;
    height: 1px;
    background-color: #b5924c !important;
}

.heart-divider .heart {
    color: #b5924c !important;
    font-size: 1.1rem;
}

.and-text {
    font-size: 0.75rem;
    letter-spacing: 2px;
    font-weight: 600;
    color: #2f3322 !important;
}

/* යුවළගේ නම් */
.couple-name {
    font-family: 'Great Vibes', cursive;
    font-size: 3.3rem;
    font-weight: 400;
    color: #3a4028 !important;
    margin: 2px 0;
    line-height: 1.1;
}

/* දිනය සහ ස්ථානය පේළි */
.event-info-row {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    text-align: left;
    margin: 14px auto;
    gap: 10px;
}

.icon-box {
    color: #b5924c !important;
    font-size: 1.4rem;
    width: 26px;
    text-align: center;
    flex-shrink: 0;
}

.vertical-line {
    width: 1.5px;
    height: 32px;
    background-color: #5c5346 !important;
    flex-shrink: 0;
}

.info-text p {
    margin: 0;
    line-height: 1.35;
}

.main-detail {
    font-size: 0.76rem;
    font-weight: 600;
    letter-spacing: 1px;
    color: #2f3322 !important;
}

.sub-detail {
    font-size: 0.65rem;
    letter-spacing: 0.8px;
    color: #4a4e3d !important;
}

.bottom-divider {
    margin-top: 15px;
}

.footer-note {
    font-size: 0.72rem;
    letter-spacing: 2px;
    font-weight: 600;
    color: #2f3322 !important;
    margin: 6px 0 18px 0;
}

/* Open Invitation Button Styling */
.open-invitation-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(135deg, #c5a059 0%, #9c7a36 100%) !important;
    color: #ffffff !important;
    text-decoration: none;
    font-family: 'Cinzel', serif;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 1.5px;
    padding: 11px 22px;
    border-radius: 30px;
    border: 1px solid #e2c588 !important;
    box-shadow: 0 6px 18px rgba(156, 122, 54, 0.35);
    transition: all 0.3s ease;
    cursor: pointer;
    animation: pulseGlow 2.5s infinite;
}

.open-invitation-btn:hover {
    background: linear-gradient(135deg, #b08b43 0%, #836428 100%) !important;
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 8px 22px rgba(156, 122, 54, 0.5);
}

/* --- Entrance & Continuous Animations --- */
.anim-floral-tl {
    opacity: 0;
    transform: translate(-30px, -30px) scale(0.9);
    transition: opacity 1.1s ease-out, transform 1.1s ease-out;
}

.anim-floral-br {
    opacity: 0;
    transform: translate(30px, 30px) scale(0.9);
    transition: opacity 1.1s ease-out, transform 1.1s ease-out;
}

.anim-floral-tl.show, .anim-floral-br.show {
    opacity: 1;
    transform: translate(0, 0) scale(1);
    animation: gentleFloat 6s ease-in-out 1.2s infinite;
}

.anim-couple {
    opacity: 0;
    transform: translateX(-25px);
    transition: opacity 1.2s ease-out, transform 1.2s ease-out;
}

.anim-couple.show {
    opacity: 0.92;
    transform: translateX(0);
}

.anim-item {
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
}

.anim-item.show {
    opacity: 1;
    transform: translateY(0);
}

@keyframes gentleFloat {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-6px); }
}

@keyframes pulseGlow {
    0%, 100% { box-shadow: 0 6px 18px rgba(156, 122, 54, 0.35); }
    50% { box-shadow: 0 6px 24px rgba(181, 146, 76, 0.65); }
}

/* Mobile Device Dark Mode Override Protection */
@media (prefers-color-scheme: dark) {
    .invitation-wrapper {
        background-color: #f3ece1 !important;
    }
    .invitation-card {
        background-color: #fbf6ee !important;
    }
    .save-the-date, .couple-name, .content-area {
        color: #3a4028 !important;
    }
    .subtitle, .and-text, .main-detail, .footer-note {
        color: #2f3322 !important;
    }
    .sub-detail {
        color: #4a4e3d !important;
    }
}

/* Mobile Responsive Adjustments */
@media (max-width: 480px) {
    .invitation-card {
        padding: 14px;
    }

    .gold-arch-frame {
        border-top-right-radius: 150px;
        border-bottom-left-radius: 150px;
        padding: 35px 15px 40px 15px;
        min-height: 560px;
    }

    .floral-top-left {
        width: 170px;
    }

    .floral-bottom-right {
        width: 165px;
    }

    .couple-container {
        width: 42%;
        bottom: 50px;
        left: 2px;
    }

    .content-area {
        margin-left: 33%;
    }

    .save-the-date {
        font-size: 2.7rem;
    }

    .save-the-date .the-word {
        font-size: 1.8rem;
    }

    .couple-name {
        font-size: 2.5rem;
    }

    .subtitle, .footer-note {
        font-size: 0.62rem;
        letter-spacing: 1.5px;
    }

    .main-detail {
        font-size: 0.66rem;
    }

    .sub-detail {
        font-size: 0.58rem;
    }

    .icon-box {
        font-size: 1.1rem;
        width: 20px;
    }

    .open-invitation-btn {
        font-size: 0.68rem;
        padding: 9px 16px;
        letter-spacing: 1px;
    }
}

/*dark mode*/
    .dark-lock-scope,
.dark-lock-scope * {
    color-scheme: light !important;
    forced-color-adjust: none !important;
    filter: none !important;
}


    </style>
</head>
<body>

    <div class="page-transition-overlay"></div>
    <div class="invitation-wrapper">
        <div class="invitation-card">
            
            <!-- 1. ඉහළ වම්පස මල් සැරසිල්ල -->
            <img src="top.png" alt="Floral Top Left" class="floral-top-left anim-floral-tl">

            <!-- රන්වන් ආරුක්කු රාමුව -->
            <div class="gold-arch-frame anim-frame">
                
                <!-- 2. ජෝඩුවගේ පින්තූරය -->
                <div class="couple-container anim-couple">
                    <img src="couple.png" alt="Kushani and Milan" class="couple-img">
                </div>

                <!-- ප්‍රධාන විස්තර කොටස -->
                <div class="content-area">
                    <h1 class="save-the-date anim-item">
                        Save <span class="gold-heart">♡</span><br>
                        <span class="the-word">the</span> Date
                    </h1>

                    <p class="subtitle anim-item">FOR THE WEDDING OF</p>

                    <div class="heart-divider anim-item">
                        <span class="line"></span>
                        <span class="heart">♡</span>
                        <span class="line"></span>
                    </div>

                    <h2 class="couple-name anim-item">Kushani</h2>

                    <div class="and-divider anim-item">
                        <span class="line"></span>
                        <span class="and-text">AND</span>
                        <span class="line"></span>
                    </div>

                    <h2 class="couple-name anim-item">Milan</h2>

                    <!-- දිනය සහ වේලාව -->
                    <div class="event-info-row anim-item">
                        <div class="icon-box">
                            <i class="fa-regular fa-calendar-days"></i>
                        </div>
                        <div class="vertical-line"></div>
                        <div class="info-text">
                            <p class="main-detail">2027 JANUARY 27</p>
                            <p class="sub-detail">6.30 PM TO 11.30 PM</p>
                        </div>
                    </div>

                    <!-- ස්ථානය -->
                    <div class="event-info-row anim-item">
                        <div class="icon-box">
                            <i class="fa-solid fa-location-dot"></i>
                        </div>
                        <div class="vertical-line"></div>
                        <div class="info-text">
                            <p class="main-detail">HOTEL GREEN SHADOW,</p>
                            <p class="main-detail">HIKKADUWA</p>
                        </div>
                    </div>

                    <div class="heart-divider bottom-divider anim-item">
                        <span class="line"></span>
                        <span class="heart">♡</span>
                        <span class="line"></span>
                    </div>

                    <p class="footer-note anim-item">INVITATION TO FOLLOW</p>

                    <!-- Open Invitation Button (ඔයාගේ අනිත් page එකේ link එක href එකට දාන්න) -->
                    <div class="btn-wrapper anim-item">
                        <a href="2.html" class="open-invitation-btn">
                            <span onclick="goToPage2()" >Open Invitation</span>
                            <i class="fa-solid fa-envelope-open-text"></i>
                        </a>
                    </div>
                </div>
            </div>

            <!-- 3. පහළ දකුණුපස මල් සැරසිල්ල -->
            <img src="bottom.png" alt="Floral Bottom Right" class="floral-bottom-right anim-floral-br">

        </div>
    </div>

    <script>


         function goToPage2() {
        // Permission Flag එක සෙට් කරලා Page 2 එකට යනවා
        sessionStorage.setItem('allowAccess', 'true');
        window.location.href = '2.html';
    }


      document.addEventListener("DOMContentLoaded", () => {
    // 1. මල් සැරසිලි සහ ජෝඩුවගේ පින්තූරය Animate කිරීම
    const floralTL = document.querySelector(".anim-floral-tl");
    const floralBR = document.querySelector(".anim-floral-br");
    const couple = document.querySelector(".anim-couple");

    setTimeout(() => {
        if (floralTL) floralTL.classList.add("show");
        if (floralBR) floralBR.classList.add("show");
    }, 150);

    setTimeout(() => {
        if (couple) couple.classList.add("show");
    }, 450);

    // 2. Text සහ Button එක පිළිවෙලට (Staggered) Animate කිරීම
    const animItems = document.querySelectorAll(".anim-item");
    animItems.forEach((item, index) => {
        setTimeout(() => {
            item.classList.add("show");
        }, 600 + (index * 160)); // එකින් එක තත්පර 0.16 ක පරතරයකින් මතු වේ
    });

    // 3. Open Invitation Button එක click කළ විට සුමටව ඊළඟ පිටුවට යාම
    const openBtn = document.querySelector(".open-invitation-btn");
    const card = document.querySelector(".invitation-card");

    if (openBtn && card) {
        openBtn.addEventListener("click", (e) => {
            const targetUrl = openBtn.getAttribute("href");
            if (targetUrl && targetUrl !== "#") {
                e.preventDefault();
                card.style.transition = "opacity 0.4s ease, transform 0.4s ease";
                card.style.opacity = "0";
                card.style.transform = "scale(0.96)";
                
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 400);
            }
        });
    }
});



//slide trans
    document.addEventListener('DOMContentLoaded', () => {
  const transitionButtons = document.querySelectorAll('.transition-btn');
  const overlay = document.querySelector('.page-transition-overlay');

  transitionButtons.forEach(button => {
    button.addEventListener('click', function(e) {
      e.preventDefault(); // එකපාරටම Page එක Reload වෙන එක නවත්වනවා
      
      const targetUrl = this.getAttribute('href'); // යා යුතු Page එකේ Link එක
      
      // Overlay Animation එක Active කරනවා
      if (overlay) {
        overlay.classList.add('is-active');
      }

      // Animation එක ඉවර වුණ ගමන් (මිලිසෙකන්ඩ් 500කින්) අලුත් පේජ් එකට යනවා
      setTimeout(() => {
        window.location.href = targetUrl;
      }, 500);
    });
  });
});


// URL එකෙන් නම ගන්නවා
 const urlParams = new URLSearchParams(window.location.search);
  const guestName = urlParams.get('name'); 
  const inviteType = urlParams.get('type');

  // නම සහ ආසන ගාන තාවකාලිකව Memory එකේ සේව් කිරීම
  if (guestName) {
    sessionStorage.setItem('weddingGuestName', guestName);
  }
  if (inviteType) {
    sessionStorage.setItem('weddingInviteType', inviteType);
  }
    </script>
</body>
</html>
